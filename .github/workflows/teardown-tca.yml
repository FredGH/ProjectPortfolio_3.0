name: Teardown TCA on AWS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm teardown of all TCA resources'
        required: true

env:
  AWS_REGION: eu-west-1
  TF_DIR: tca/terraform/environments/prod
  CLUSTER: tca-prod-cluster
  SERVICE_PREFIX: tca-prod
  TF_STATE_BUCKET: tca-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}
  TF_LOCK_TABLE: tca-terraform-locks

jobs:
  teardown:
    name: Destroy
    runs-on: ubuntu-latest
    if: inputs.confirm == 'destroy'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -reconfigure

      - name: Write tfvars
        working-directory: ${{ env.TF_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          db_password = "${{ secrets.TF_VAR_DB_PASSWORD }}"
          image_tag   = "latest"
          EOF

      - name: Scale ECS services to zero
        run: |
          for SVC in api mock-server airflow-webserver airflow-scheduler; do
            aws ecs update-service \
              --cluster "${{ env.CLUSTER }}" \
              --service "${{ env.SERVICE_PREFIX }}-${SVC}" \
              --desired-count 0 \
              --output text --query 'service.serviceName' 2>/dev/null || true
          done
          echo "Services scaled to 0. Waiting 30 s for tasks to drain …"
          sleep 30

      - name: Empty ECR repositories
        run: |
          for REPO in tca-api tca-mock-server tca-airflow tca-angular; do
            IMAGES=$(aws ecr list-images \
              --repository-name "$REPO" \
              --region "${{ env.AWS_REGION }}" \
              --query 'imageIds[*]' \
              --output json 2>/dev/null)
            if [ "$IMAGES" != "[]" ] && [ -n "$IMAGES" ]; then
              aws ecr batch-delete-image \
                --repository-name "$REPO" \
                --image-ids "$IMAGES" \
                --region "${{ env.AWS_REGION }}" || true
            fi
          done
          echo "ECR repos emptied."

      - name: Empty S3 SPA bucket
        run: |
          BUCKET="tca-prod-angular-spa"
          if aws s3api head-bucket --bucket "$BUCKET" --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            # Delete all versioned objects and delete markers
            aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --region "${{ env.AWS_REGION }}" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null | \
              python3 -c "
import json, sys, subprocess
data = json.load(sys.stdin)
objs = data.get('Objects') or []
if objs:
    payload = json.dumps({'Objects': objs, 'Quiet': True})
    subprocess.run(['aws', 's3api', 'delete-objects',
                    '--bucket', '$BUCKET',
                    '--region', '${{ env.AWS_REGION }}',
                    '--delete', payload], check=True)
" || true
            # Delete all delete markers
            aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --region "${{ env.AWS_REGION }}" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null | \
              python3 -c "
import json, sys, subprocess
data = json.load(sys.stdin)
objs = data.get('Objects') or []
if objs:
    payload = json.dumps({'Objects': objs, 'Quiet': True})
    subprocess.run(['aws', 's3api', 'delete-objects',
                    '--bucket', '$BUCKET',
                    '--region', '${{ env.AWS_REGION }}',
                    '--delete', payload], check=True)
" || true
            # Also remove any unversioned objects
            aws s3 rm "s3://$BUCKET" --recursive --region "${{ env.AWS_REGION }}" || true
            echo "S3 bucket $BUCKET emptied."
          else
            echo "Bucket $BUCKET does not exist; skipping."
          fi

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve

      - name: Confirm teardown
        run: echo "All TCA resources destroyed. No further AWS charges will accrue."
