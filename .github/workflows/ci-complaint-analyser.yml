name: complaint-analyser CI

on:
  push:
    paths:
      - 'complaint_analyser/**'
  pull_request:
    paths:
      - 'complaint_analyser/**'

defaults:
  run:
    working-directory: complaint_analyser

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: complaint_analyser/pyproject.toml

      - run: pip install ruff isort black

      - run: ruff check . && isort --check . && black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: complaint_analyser/pyproject.toml

      - run: pip install -e ".[dev]"

      - run: coverage run -m unittest discover -s tests

      - run: coverage report -m --fail-under=80

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: complaint_analyser/.coverage

  validate-configs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: complaint_analyser/pyproject.toml

      - run: pip install -e ".[dev]"

      - run: python scripts/validate_configs.py

      - run: docker compose config --quiet

  build:
    runs-on: ubuntu-latest
    needs: [test, validate-configs]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: complaint_analyser
            file: complaint_analyser/Dockerfile
          - service: spacy_service
            context: complaint_analyser
            file: complaint_analyser/spacy_service/Dockerfile
          - service: bertopic_service
            context: complaint_analyser
            file: complaint_analyser/bertopic_service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/complaint-analyser-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
