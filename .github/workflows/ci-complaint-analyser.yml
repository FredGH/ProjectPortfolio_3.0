name: complaint-analyser CI

on:
  push:
    paths:
      - 'complaint_analyser/**'
  pull_request:
    paths:
      - 'complaint_analyser/**'

defaults:
  run:
    working-directory: complaint_analyser

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: complaint_analyser/pyproject.toml

      - run: pip install ruff isort black

      - run: ruff check . && isort --check . && black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: complaint_analyser/pyproject.toml

      - run: pip install -e ".[dev]"

      - run: coverage run -m unittest discover -s tests

      - run: coverage report -m --fail-under=80

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: complaint_analyser/.coverage

  validate-configs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: complaint_analyser/pyproject.toml

      - run: pip install -e ".[dev]"

      - run: python scripts/validate_configs.py

      - run: docker compose config --quiet
