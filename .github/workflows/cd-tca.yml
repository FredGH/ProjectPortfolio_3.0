name: tca CD

# Triggered automatically when CI passes on main, or manually via workflow_dispatch.
# The deploy job is gated by the "production" environment — a reviewer must approve
# before Terraform / Docker / ECS steps run.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (leave blank to use git SHA)'
        required: false
        default: ''
  workflow_run:
    workflows: ["Run TCA CI"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: eu-west-1
  TF_DIR: tca/terraform/environments/prod
  CLUSTER: tca-prod-cluster
  SERVICE_PREFIX: tca-prod
  TF_LOCK_TABLE: tca-terraform-locks

jobs:
  deploy:
    name: Terraform + Build & push + Redeploy ECS
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      TF_STATE_BUCKET: tca-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}

    defaults:
      run:
        working-directory: tca

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ── AWS credentials ────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Resolve image tag ──────────────────────────────────────────────────
      - name: Set image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
            TAG="${TAG::8}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      # ── Bootstrap Terraform remote state (idempotent) ──────────────────────
      - name: Bootstrap Terraform state backend
        run: |
          BUCKET="${{ env.TF_STATE_BUCKET }}"
          REGION="${{ env.AWS_REGION }}"

          # Create S3 bucket (no-op if it already exists)
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,\
                BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "S3 state bucket created: $BUCKET"
          else
            echo "S3 state bucket already exists: $BUCKET"
          fi

          # Create DynamoDB lock table (no-op if it already exists)
          if ! aws dynamodb describe-table --table-name "${{ env.TF_LOCK_TABLE }}" \
              --region "$REGION" 2>/dev/null; then
            aws dynamodb create-table \
              --table-name "${{ env.TF_LOCK_TABLE }}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            echo "DynamoDB lock table created."
          else
            echo "DynamoDB lock table already exists."
          fi

      # ── Terraform ─────────────────────────────────────────────────────────
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -reconfigure

      - name: Write tfvars
        working-directory: ${{ env.TF_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          db_password = "${{ secrets.TF_VAR_DB_PASSWORD }}"
          image_tag   = "${{ steps.tag.outputs.tag }}"
          alarm_email = "${{ secrets.ALARM_EMAIL }}"
          EOF

      - name: Import orphaned AWS resources into state
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Resources created by a previous failed run may exist in AWS but not
          # in state. Import them so Terraform can manage them rather than failing
          # with "already exists". Each import is a no-op if already in state.

          import_if_missing() {
            local addr=$1 id=$2 check_cmd=$3
            if eval "$check_cmd" 2>/dev/null; then
              terraform import "$addr" "$id" 2>/dev/null && \
                echo "Imported $addr" || echo "$addr already in state"
            fi
          }

          import_if_missing \
            "module.rds.aws_db_parameter_group.timescaledb" \
            "tca-prod-pg16-timescaledb" \
            "aws rds describe-db-parameter-groups \
              --db-parameter-group-name tca-prod-pg16-timescaledb \
              --region ${{ env.AWS_REGION }}"

      - name: Clear stale Terraform lock (if any)
        run: |
          LOCK_KEY="${{ env.TF_STATE_BUCKET }}/prod/terraform.tfstate"
          LOCK=$(aws dynamodb get-item \
            --table-name "${{ env.TF_LOCK_TABLE }}" \
            --key "{\"LockID\": {\"S\": \"$LOCK_KEY\"}}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Item.LockID.S' \
            --output text 2>/dev/null || echo "")
          if [ -n "$LOCK" ] && [ "$LOCK" != "None" ]; then
            echo "Stale lock found — clearing $LOCK_KEY"
            aws dynamodb delete-item \
              --table-name "${{ env.TF_LOCK_TABLE }}" \
              --key "{\"LockID\": {\"S\": \"$LOCK_KEY\"}}" \
              --region "${{ env.AWS_REGION }}"
            echo "Lock cleared."
          else
            echo "No stale lock."
          fi

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      # ── Capture Terraform outputs ──────────────────────────────────────────
      - name: Get Terraform outputs
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: |
          RDS_ADDR=$(terraform output -raw rds_address)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          CF_URL=$(terraform output -raw cloudfront_url)
          REDIS_CS=$(terraform output -raw redis_connection_string)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          API_SG=$(terraform output -raw api_sg_id)
          CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          S3_BUCKET=$(terraform output -raw s3_spa_bucket)
          DASHBOARD_URL=$(terraform output -raw dashboard_url)
          echo "rds_addr=$RDS_ADDR"             >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS"               >> "$GITHUB_OUTPUT"
          echo "cf_url=$CF_URL"                 >> "$GITHUB_OUTPUT"
          echo "redis_cs=$REDIS_CS"             >> "$GITHUB_OUTPUT"
          echo "subnets=$SUBNETS"               >> "$GITHUB_OUTPUT"
          echo "api_sg=$API_SG"                 >> "$GITHUB_OUTPUT"
          echo "cf_dist_id=$CF_DIST_ID"         >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$S3_BUCKET"           >> "$GITHUB_OUTPUT"
          echo "dashboard_url=$DASHBOARD_URL"   >> "$GITHUB_OUTPUT"

      # ── Update Secrets Manager with real endpoints ─────────────────────────
      - name: Seed Secrets Manager
        env:
          DB_PASS: ${{ secrets.TF_VAR_DB_PASSWORD }}
          RDS_ADDR: ${{ steps.tf.outputs.rds_addr }}
          REDIS_CS: ${{ steps.tf.outputs.redis_cs }}
        run: |
          aws secretsmanager update-secret \
            --secret-id "tca/db-credentials" \
            --secret-string "postgresql://tca_user:${DB_PASS}@${RDS_ADDR}:5432/tca_db"

          aws secretsmanager update-secret \
            --secret-id "tca/airflow-db" \
            --secret-string "postgresql+psycopg2://tca_user:${DB_PASS}@${RDS_ADDR}:5432/airflow_db"

          aws secretsmanager update-secret \
            --secret-id "tca/redis-url" \
            --secret-string "${REDIS_CS}"

          openssl genrsa -out /tmp/jwt_priv.pem 2048 2>/dev/null
          openssl rsa -in /tmp/jwt_priv.pem -pubout -out /tmp/jwt_pub.pem 2>/dev/null
          aws secretsmanager update-secret \
            --secret-id "tca/jwt-private-key" \
            --secret-string "$(cat /tmp/jwt_priv.pem)"
          aws secretsmanager update-secret \
            --secret-id "tca/jwt-public-key" \
            --secret-string "$(cat /tmp/jwt_pub.pem)"
          rm -f /tmp/jwt_priv.pem /tmp/jwt_pub.pem

          aws secretsmanager update-secret \
            --secret-id "tca/airflow-secret-key" \
            --secret-string "$(openssl rand -hex 32)"

      # ── Build and push Docker images ───────────────────────────────────────
      - name: Clear Docker credential store
        # ubuntu-latest sets credsStore:desktop-linux which makes amazon-ecr-login
        # store credentials via a helper. That helper is not in PATH during docker
        # push, causing "no basic auth credentials". Clearing credsStore forces the
        # action to store credentials in the auths section instead.
        run: |
          mkdir -p ~/.docker
          printf '{}' > ~/.docker/config.json

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REG: ${{ steps.ecr-login.outputs.registry }}
        run: |
          # tca-api (FastAPI + analytics)
          docker build -t "$REG/tca-api:$TAG" -t "$REG/tca-api:latest" -f Dockerfile .
          docker push "$REG/tca-api:$TAG"
          docker push "$REG/tca-api:latest"

          # tca-mock-server shares the same image as tca-api
          docker tag "$REG/tca-api:$TAG" "$REG/tca-mock-server:$TAG"
          docker tag "$REG/tca-api:$TAG" "$REG/tca-mock-server:latest"
          docker push "$REG/tca-mock-server:$TAG"
          docker push "$REG/tca-mock-server:latest"

          # tca-airflow
          docker build -t "$REG/tca-airflow:$TAG" -t "$REG/tca-airflow:latest" -f Dockerfile.airflow .
          docker push "$REG/tca-airflow:$TAG"
          docker push "$REG/tca-airflow:latest"

          # tca-angular (nginx SPA)
          docker build -t "$REG/tca-angular:$TAG" -t "$REG/tca-angular:latest" \
            -f Dockerfile.angular .
          docker push "$REG/tca-angular:$TAG"
          docker push "$REG/tca-angular:latest"

      # ── Upload Angular SPA to S3 + invalidate CloudFront ─────────────────────
      - name: Upload Angular SPA to S3
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REG: ${{ steps.ecr-login.outputs.registry }}
          CF_ID: ${{ steps.tf.outputs.cf_dist_id }}
          S3_BUCKET: ${{ steps.tf.outputs.s3_bucket }}
        run: |
          # Extract pre-built Angular dist from the Docker image
          CID=$(docker create "$REG/tca-angular:$TAG")
          docker cp "$CID:/usr/share/nginx/html" /tmp/angular-dist
          docker rm "$CID"

          # Sync all assets; re-upload index.html with no-cache so browsers
          # always fetch the latest shell on next visit
          aws s3 sync /tmp/angular-dist "s3://$S3_BUCKET" \
            --delete \
            --region "${{ env.AWS_REGION }}"
          aws s3 cp /tmp/angular-dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            --region "${{ env.AWS_REGION }}"

          # Flush CloudFront edge caches so visitors get the new build
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/*"
          echo "Angular SPA uploaded to s3://$S3_BUCKET and CloudFront invalidated."

      # ── Bootstrap DB as a one-off Fargate task ─────────────────────────────
      - name: Bootstrap DB (init.sql + seed)
        env:
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          API_SG: ${{ steps.tf.outputs.api_sg }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          SUBNET_JSON=$(echo "$SUBNETS" | \
            python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip().split(',')))")

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ env.CLUSTER }}" \
            --task-definition "${{ env.SERVICE_PREFIX }}-api" \
            --launch-type FARGATE \
            --network-configuration \
              "{\"awsvpcConfiguration\":{\"subnets\":${SUBNET_JSON},\
                \"securityGroups\":[\"${API_SG}\"],\"assignPublicIp\":\"DISABLED\"}}" \
            --overrides \
              "{\"containerOverrides\":[{\"name\":\"tca-api\",\
                \"command\":[\"python\",\"ingestion/bootstrap.py\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Bootstrap task: $TASK_ARN"
          echo "Waiting for bootstrap to complete (up to 10 minutes)…"
          aws ecs wait tasks-stopped \
            --cluster "${{ env.CLUSTER }}" \
            --tasks "$TASK_ARN"

          TASK_JSON=$(aws ecs describe-tasks \
            --cluster "${{ env.CLUSTER }}" \
            --tasks "$TASK_ARN")

          EXIT=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].exitCode // "null"')
          STOP_CODE=$(echo "$TASK_JSON" | jq -r '.tasks[0].stopCode // ""')
          STOP_REASON=$(echo "$TASK_JSON" | jq -r '.tasks[0].stoppedReason // ""')
          CONTAINER_REASON=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].reason // ""')

          echo "Exit code    : $EXIT"
          echo "Stop code    : $STOP_CODE"
          echo "Stopped reason : $STOP_REASON"
          echo "Container reason: $CONTAINER_REASON"

          # Fetch last 50 CloudWatch log lines for this task
          TASK_ID="${TASK_ARN##*/}"
          aws logs get-log-events \
            --log-group-name "/ecs/${{ env.SERVICE_PREFIX }}" \
            --log-stream-name "api/tca-api/${TASK_ID}" \
            --limit 50 \
            --region "${{ env.AWS_REGION }}" \
            --query 'events[*].message' \
            --output text 2>/dev/null || echo "(no CloudWatch logs found)"

          if [ "$EXIT" != "0" ]; then
            echo "Bootstrap task failed (exit $EXIT)."
            exit 1
          fi
          echo "Bootstrap succeeded."

      # ── Initialise Airflow metadata DB (one-off Fargate task) ─────────────
      - name: Initialise Airflow DB
        env:
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          API_SG: ${{ steps.tf.outputs.api_sg }}
        run: |
          SUBNET_JSON=$(echo "$SUBNETS" | \
            python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip().split(',')))")

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ env.CLUSTER }}" \
            --task-definition "${{ env.SERVICE_PREFIX }}-airflow-webserver" \
            --launch-type FARGATE \
            --network-configuration \
              "{\"awsvpcConfiguration\":{\"subnets\":${SUBNET_JSON},\
                \"securityGroups\":[\"${API_SG}\"],\"assignPublicIp\":\"DISABLED\"}}" \
            --overrides \
              "{\"containerOverrides\":[{\"name\":\"tca-airflow-webserver\",\
                \"command\":[\"airflow\",\"db\",\"migrate\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Airflow db migrate task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster "${{ env.CLUSTER }}" \
            --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks \
            --cluster "${{ env.CLUSTER }}" \
            --tasks "$TASK_ARN" | jq -r '.tasks[0].containers[0].exitCode // 1')

          if [ "$EXIT" != "0" ]; then
            echo "Airflow db migrate failed (exit $EXIT)"
            exit 1
          fi
          echo "Airflow DB initialised."

      # ── Create Airflow admin user (idempotent one-off Fargate task) ──────────
      - name: Create Airflow admin user
        env:
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          API_SG: ${{ steps.tf.outputs.api_sg }}
        run: |
          SUBNET_JSON=$(echo "$SUBNETS" | \
            python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip().split(',')))")

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ env.CLUSTER }}" \
            --task-definition "${{ env.SERVICE_PREFIX }}-airflow-webserver" \
            --launch-type FARGATE \
            --network-configuration \
              "{\"awsvpcConfiguration\":{\"subnets\":${SUBNET_JSON},\
                \"securityGroups\":[\"${API_SG}\"],\"assignPublicIp\":\"DISABLED\"}}" \
            --overrides \
              "{\"containerOverrides\":[{\"name\":\"tca-airflow-webserver\",\
                \"command\":[\"airflow\",\"users\",\"create\",\
                  \"--username\",\"admin\",\
                  \"--password\",\"admin\",\
                  \"--firstname\",\"Admin\",\
                  \"--lastname\",\"User\",\
                  \"--role\",\"Admin\",\
                  \"--email\",\"admin@example.com\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Airflow admin user task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster "${{ env.CLUSTER }}" \
            --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks \
            --cluster "${{ env.CLUSTER }}" \
            --tasks "$TASK_ARN" | jq -r '.tasks[0].containers[0].exitCode // 1')
          if [ "$EXIT" != "0" ]; then
            echo "Admin user creation returned exit $EXIT (user may already exist — continuing)."
          else
            echo "Airflow admin user created."
          fi

      # ── Force ECS redeployment with new images ─────────────────────────────
      - name: Force ECS redeployment
        run: |
          for SVC in api mock-server airflow-webserver airflow-scheduler; do
            aws ecs update-service \
              --cluster "${{ env.CLUSTER }}" \
              --service "${{ env.SERVICE_PREFIX }}-${SVC}" \
              --force-new-deployment \
              --output text --query 'service.serviceName'
          done

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.CLUSTER }}" \
            --services \
              "${{ env.SERVICE_PREFIX }}-api" \
              "${{ env.SERVICE_PREFIX }}-mock-server" \
              "${{ env.SERVICE_PREFIX }}-airflow-webserver" \
              "${{ env.SERVICE_PREFIX }}-airflow-scheduler"

      # ── Update README with live endpoints ─────────────────────────────────
      - name: Update README live endpoints
        working-directory: ${{ github.workspace }}
        env:
          CF_URL: ${{ steps.tf.outputs.cf_url }}
          ALB_DNS: ${{ steps.tf.outputs.alb_dns }}
          DASHBOARD_URL: ${{ steps.tf.outputs.dashboard_url }}
        run: |
          python3 - <<'PYEOF'
import os, re

readme = "tca/README.md"
cf_url        = os.environ["CF_URL"]
alb_dns       = os.environ["ALB_DNS"]
dashboard_url = os.environ["DASHBOARD_URL"]

replacements = {
    ("CLOUDFRONT_URL_START", "CLOUDFRONT_URL_END"):
        f"<!-- CLOUDFRONT_URL_START -->\n```\n{cf_url}\n```\n<!-- CLOUDFRONT_URL_END -->",
    ("AIRFLOW_URL_START", "AIRFLOW_URL_END"):
        f"<!-- AIRFLOW_URL_START -->\n```\nhttp://{alb_dns}/airflow\n```\n<!-- AIRFLOW_URL_END -->",
    ("API_DOCS_URL_START", "API_DOCS_URL_END"):
        f"<!-- API_DOCS_URL_START -->\n```\nhttp://{alb_dns}/api/docs\n```\n<!-- API_DOCS_URL_END -->",
    ("DASHBOARD_URL_START", "DASHBOARD_URL_END"):
        f"<!-- DASHBOARD_URL_START -->\n```\n{dashboard_url}\n```\n<!-- DASHBOARD_URL_END -->",
}

text = open(readme).read()
for (start, end), replacement in replacements.items():
    text = re.sub(
        rf"<!-- {start} -->.*?<!-- {end} -->",
        replacement,
        text,
        flags=re.DOTALL,
    )
open(readme, "w").write(text)
print("README endpoints updated.")
PYEOF

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tca/README.md
          git diff --staged --quiet || \
            git commit -m "chore: update live endpoint URLs in README [skip ci]"
          git push

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Summary
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ALB="${{ steps.tf.outputs.alb_dns }}"
          CF="${{ steps.tf.outputs.cf_url }}"
          DASH="${{ steps.tf.outputs.dashboard_url }}"
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Angular SPA | $CF |" >> "$GITHUB_STEP_SUMMARY"
          echo "| API docs | http://$ALB/api/docs |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Airflow UI | http://$ALB/airflow |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Observability | $DASH |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`$TAG\` |" >> "$GITHUB_STEP_SUMMARY"
