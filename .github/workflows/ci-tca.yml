name: tca CI

on:
  push:
    branches: ["**"]
    paths:
      - "tca/**"
      - ".github/workflows/ci-tca.yml"
  pull_request:
    branches: [main]
    paths:
      - "tca/**"
      - ".github/workflows/ci-tca.yml"

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  POSTGRES_USER: tca_user
  POSTGRES_PASSWORD: tca_password
  POSTGRES_DB: tca_db
  DATABASE_URL: postgresql://tca_user:tca_password@localhost:5432/tca_db
  REDIS_URL: redis://localhost:6379/0

jobs:
  # ── Code quality ─────────────────────────────────────────────────────────
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff isort black

      - name: ruff
        run: ruff check .

      - name: isort
        run: isort --check .

      - name: black
        run: black --check .

  # ── Python unit + integration tests ──────────────────────────────────────
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    needs: [quality]
    defaults:
      run:
        working-directory: tca

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: tca_user
          POSTGRES_PASSWORD: tca_password
          POSTGRES_DB: tca_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tca_user -d tca_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt coverage

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Apply database schema
        run: PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -f init.sql

      - name: Seed synthetic data
        run: python ingestion/seed.py

      - name: Run tests
        run: coverage run -m unittest discover -s tests

      - name: Coverage report
        run: coverage report -m

  # ── dbt Data Vault build + tests ─────────────────────────────────────────
  test-dbt:
    name: dbt build
    runs-on: ubuntu-latest
    needs: [test-python]
    defaults:
      run:
        working-directory: tca

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: tca_user
          POSTGRES_PASSWORD: tca_password
          POSTGRES_DB: tca_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tca_user -d tca_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Apply database schema
        run: PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -f init.sql

      - name: Seed synthetic data
        run: python ingestion/seed.py

      - name: dbt deps
        run: dbt deps

      - name: dbt build (staging → raw_vault → biz_vault → marts)
        run: dbt build --target ci

      - name: dbt source freshness
        run: dbt source freshness --target ci

  # ── Angular production build ──────────────────────────────────────────────
  test-angular:
    name: Angular build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tca/frontend/package-lock.json

      - name: Install dependencies
        working-directory: tca/frontend
        run: npm ci

      - name: Production build
        working-directory: tca/frontend
        run: npm run build -- --configuration production
