x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-tca_user}:${POSTGRES_PASSWORD:-tca_password}@postgres/airflow_db
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-supersecretkey-change-in-prod}
    DATABASE_URL: postgresql://${POSTGRES_USER:-tca_user}:${POSTGRES_PASSWORD:-tca_password}@postgres:5432/${POSTGRES_DB:-tca_db}
    REDIS_URL: redis://redis:6379/0
    PYTHONPATH: /opt/airflow/tca
  volumes:
    - ./dags:/opt/airflow/dags
    - .:/opt/airflow/tca
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── Storage ──────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tca_password}
      POSTGRES_DB: ${POSTGRES_DB:-tca_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tca_user} -d ${POSTGRES_DB:-tca_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Python services ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tca_user}:${POSTGRES_PASSWORD:-tca_password}@postgres:5432/${POSTGRES_DB:-tca_db}
      REDIS_URL: redis://redis:6379/0
      JWT_ALGORITHM: RS256
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: "8"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      JWT_PRIVATE_KEY_PATH: /tmp/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/jwt_public.pem
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-tca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tca_password}
      POSTGRES_DB: ${POSTGRES_DB:-tca_db}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  mock-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tca_user}:${POSTGRES_PASSWORD:-tca_password}@postgres:5432/${POSTGRES_DB:-tca_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn ingestion.mock.mock_server:app --host 0.0.0.0 --port 8001

  # ── Frontend (Angular 17 SPA) ─────────────────────────────────
  angular:
    build:
      context: .
      dockerfile: Dockerfile.angular
    ports:
      - "4200:80"
    depends_on:
      - app
    environment:
      API_URL: http://app:8000

  # ── Airflow ──────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    command: >-
      bash -c "airflow db migrate &&
      (airflow users create
      --username ${AIRFLOW_ADMIN_USER:-admin}
      --firstname Admin --lastname User
      --role Admin
      --email admin@privatebank.de
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      || true)"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
