# Black-and-electric-yellow theme (see .claude/web-design/DESIGN.md).
# Native widget colours come from here; shapes, fonts and borders are
# styled in core.ui.theme.apply_theme(), which every page calls.
[theme]
base = "dark"
primaryColor = "#faff69"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#1a1a1a"
textColor = "#ffffff"
font = "sans serif"
