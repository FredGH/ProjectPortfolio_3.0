# Purple-on-white theme (see .claude/web-design/DESIGN.md). Native
# widget colours come from here; shapes, fonts and shadows are styled in
# core.ui.theme.apply_theme(), which every page calls.
[theme]
base = "light"
primaryColor = "#7132f5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f6"
textColor = "#101114"
font = "sans serif"
