version: 2

sources:
  - name: dedup_ingest
    schema: dedup
    tables:
      - name: job_blocking_keys
        description: >
          Written by the compute-blocking-keys pipeline CLI subcommand
          (core.dedup.write_blocking_keys), not dbt. One row per
          silver__job_posting job, carrying its normalised company,
          matching (seniority-stripped) title, resolved country/region,
          concatenated block key, and exact-duplicate content hash.
        columns:
          - name: job_key
            description: "Matches silver.silver__job_posting.job_key."
      - name: job_similarity_features
        description: >
          Written by the compute-similarity-features pipeline CLI
          subcommand (core.dedup.write_similarity_features). One row per
          silver__job_posting job: a description SimHash fingerprint and
          Step 6's parsed-salary output.
        columns:
          - name: job_key
            description: "Matches silver.silver__job_posting.job_key."
      - name: pair_title_scores
        description: >
          Written by the compute-title-similarity-scores pipeline CLI
          subcommand (core.dedup.write_title_similarity_scores). One row
          per dedup__candidate_pairs row — the one Step 8 signal
          computed per PAIR rather than per job, since rapidfuzz's
          token_set_ratio has no SQL equivalent.

models:
  - name: dedup__exact_duplicates
    description: >
      One row per job that shares job_url_canonical OR content_sha256
      with at least one other job — PLAN.md Step 7's "cheap matches
      first" check. duplicate_group_key identifies which group a row
      belongs to; two jobs with the same duplicate_group_key AND the
      same duplicate_type are the same exact-match group.
    columns:
      - name: job_key
        data_type: text
        tests:
          - not_null
      - name: duplicate_type
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['url_canonical', 'content_hash']
      - name: duplicate_group_key
        description: "The shared job_url_canonical or content_sha256 value."
        data_type: text
        tests:
          - not_null
      - name: group_size
        description: "How many jobs share this duplicate_group_key."
        data_type: bigint
        tests:
          - not_null

  - name: dedup__candidate_pairs
    description: >
      One row per candidate pair sharing a blocking key or company
      alone (soft block). Feeds Step 8's similarity scoring — nothing
      downstream should regenerate candidate pairs independently.
    columns:
      - name: job_key_a
        data_type: text
        tests:
          - not_null
      - name: job_key_b
        data_type: text
        tests:
          - not_null
      - name: match_type
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['block', 'soft_block']

  - name: dedup__similarity_scores
    description: >
      One row per Step 7 candidate pair, every Step 8 component signal
      persisted separately plus an initial blend (see this plan's
      documented weight table) — Step 9 recalibrates the blend from
      real labelled pairs, reading these components directly rather
      than recomputing anything.
    columns:
      - name: job_key_a
        data_type: text
        tests:
          - not_null
      - name: job_key_b
        data_type: text
        tests:
          - not_null
      - name: match_type
        data_type: text
        tests:
          - not_null
      - name: company_similarity
        data_type: "double precision"
        tests:
          - not_null
      - name: title_similarity
        data_type: numeric
        tests:
          - not_null
      - name: description_similarity
        data_type: "double precision"
        tests:
          - not_null
      - name: location_similarity
        data_type: "double precision"
        tests:
          - not_null
      - name: date_diff_days
        data_type: "double precision"
        tests:
          - not_null
      - name: date_similarity
        data_type: "double precision"
        tests:
          - not_null
      - name: salary_similarity
        data_type: "double precision"
        tests:
          - not_null
      - name: hard_veto
        data_type: boolean
        tests:
          - not_null
      - name: blended_score
        data_type: "double precision"
        tests:
          - not_null
