name: 'job_search'
version: '1.0.0'
config-version: 2

profile: 'job_search'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  job_search:
    +schema: market_config

vars:
  lifecycle_live_window_days: 7
  role_drift_min_postings: 30

models:
  job_search:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    silver:
      +materialized: table
      +schema: silver
    dedup:
      +materialized: table
      +schema: dedup
    gold:
      +materialized: table
      +schema: gold
    market:
      +materialized: table
      +schema: gold
