# Per-task LLM provider/model routing. See DECISIONS.md §1 — the whole
# point of this file is that a task's provider moves independently of
# every other task's, with no global switch anywhere in the code.
#
# The task list mirrors the split in DECISIONS.md §1's "task split" table.
# Populated as each task's producing step (Step 13+) is implemented;
# entries below are the ones referenced by name elsewhere in this repo.
tasks:
  fabrication_critic:
    provider: anthropic
    model: claude-sonnet-5
    prompt_family: claude
  manual_entry_parse:
    provider: ollama
    model: llama3.1:8b
    prompt_family: local
  job_categorisation:
    provider: anthropic
    model: claude-sonnet-5
    prompt_family: claude
    eval_metric: exact_match
    eval_regression_threshold: 0.05
  cv_extraction:
    provider: ollama
    model: llama3.1:8b
    prompt_family: local
    eval_metric: field_f1
    eval_regression_threshold: 0.05
  skill_extraction:
    provider: ollama
    model: llama3.1:8b
    prompt_family: local
    eval_metric: field_f1
    eval_regression_threshold: 0.05
  eval_judge:
    provider: anthropic
    model: claude-sonnet-5
    prompt_family: claude
  skill_mapping:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    prompt_family: claude
  job_scoring:
    provider: anthropic
    model: claude-sonnet-5
    prompt_family: claude
  # Step 17. Claude by default (a local Docker Ollama on CPU took 20+ min
  # per attempt). To run it locally instead set provider: ollama,
  # model: llama3.1:8b, prompt_family: local (prompts/cv_tailoring/local.v1.md
  # exists).
  cv_tailoring:
    provider: anthropic
    model: claude-sonnet-5
    prompt_family: claude
    # The local variants the Tailor backend selector offers (Ollama on this
    # Mac or the Docker service); see core/tailoring/backends.py.
    local_provider: ollama
    local_model: llama3.1:8b
    local_prompt_family: local
