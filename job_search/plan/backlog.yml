    - "Authenticate at the API layer; Streamlit session state is not an auth boundary"
    - "Cheap hygiene worth doing regardless: no personal data in application logs"
    - "Cheap hygiene worth doing regardless: confirm encryption at rest is on (free
      on managed Postgres)"
    - "Decide and document whether recruiter and interviewer NAMES are stored at all
      — roles and dates may be sufficient and are simpler"

    jira_key: JOB-413
  - id: STEP-23
    summary: "Step 23 — n8n approval gates and digest"
    description: >
      Webhook-triggered only, no cron. n8n calls FastAPI and holds no
      business logic.
    acceptance: >
      A new 85+ scored job triggers a digest, and artefact generation waits
      for explicit approval before running.
    labels: [orchestration]
    points: 5
    blocks: [STEP-23A]
    subtasks:
    - "Deploy n8n (GCE e2-small or local, not Cloud Run)"
    - "Webhook endpoint on FastAPI to trigger n8n workflows"
    - "Daily digest workflow: new jobs scoring 85+"
    - "Approval gate workflow before artefact generation"
    - "Digest and approval workflows are per-user; never fan out one user's jobs to
      another"
    - "Verify n8n holds zero business logic — endpoints only"

    jira_key: JOB-422
  - id: STEP-23A
    summary: "Step 23a — Near-real-time alerting on top-percentile jobs"
    description: >
      The daily digest is right for most volume, but early applicants get
      read. A top-percentile fit should reach you within minutes, not
      tomorrow morning. Deliberately narrow: a channel that fires often
      stops being an alert.
    acceptance: >
      A newly ingested job in the top percentile band produces a
      notification within minutes of ingestion, and the alert rate stays
      within the configured daily cap.
    labels: [orchestration]
    points: 3
    subtasks:
    - "High-frequency ingestion tier for the highest-yield sources only"
    - "Score newly ingested jobs immediately rather than waiting for the batch"
    - "Percentile-based threshold against your own score distribution, not a fixed
      number"
    - "Hard daily alert cap — an alert that fires often is not an alert"
    - "Push channel: Telegram or mobile push, with the apply URL and score rationale
      in the message"
    - "Suppress alerts for jobs already deduplicated into a known job_group_id"
    - "Quiet hours honouring each user's own timezone and notification preferences"
    - "Alert threshold is per-user, computed against that user's own score distribution"
    - "Respect the per-user alert cap from the quotas table"
    - "Log alert-to-application conversion so the threshold can be tuned against outcomes"

# =============================================================================
# NICE TO HAVE — unscheduled, ordered most to least important
# =============================================================================
# These do NOT sync as scheduled work. Create them in Jira as a separate
# "Backlog / Later" epic with no sprint and no dependency links, so they sit
# visible but do not distort velocity on the scheduled plan.
#
# `priority` is the implementation order. `trigger` states the condition that
# should promote an item into the scheduled plan — several of these are
# cheap now and expensive later.
# =============================================================================

    jira_key: JOB-429
  jira_key: JOB-7
nice_to_have:
  epic:
    key: LATER
    summary: "Later — unscheduled improvements"
    labels: [jobsearch]

  items:

  - priority: 1
    summary: "Data protection compliance (UK GDPR)"
    why: >
      DELIBERATELY OUT OF SCOPE for the current design. Two users, trusted,
      personal job hunting, not published and not commercial — that sits
      within the UK GDPR household/personal-use exemption, so the statutory
      machinery is not required. Listed first because the TRIGGER matters
      more than the priority: the exemption stops applying the moment the
      scope changes, and by then the data is already collected.
      Scope when triggered: self-service export; account deletion cascading
      across every per-user table AND object storage, caches and generated
      document files; retention policy per data class enforced by a
      scheduled job; privacy notice naming lawful basis and every processor
      (LLM provider, cloud, job APIs); DPA review for each; audit log of
      per-user data access; incident response note.
    trigger: >
      ANY of: a third user outside the trusted pair; any commercial or
      client use; public sign-up including a portfolio demo others can
      register for; storing third-party contact details at scale.
    labels: [gdpr, security]
    points: 8

  - priority: 2
    summary: "Application outcome loop"
    why: >
      The highest-value item not in the scheduled plan. The system generates
      artefacts and never learns whether they worked. Feed outcomes back into
      the Step 16 scoring weights so ranking becomes empirical rather than a
      static heuristic, and A/B the CV variants against real callback rates.
    trigger: "Once ~30 applications have recorded outcomes"
    labels: [outcomes, calibration]
    points: 5

  - priority: 3
    summary: "Persist rate-limit state in Postgres"
    why: >
      Not an enhancement — a defect in the current design. The Step 3 token
      bucket is in-process, but the GCP pipeline is an ephemeral Cloud Run
      Job, so state dies with the container and every run starts with a full
      bucket. Expect 429s or source bans.
    trigger: "Before the first scheduled unattended run in GCP (Step 22)"
    labels: [ingestion, infra]
    points: 2

  - priority: 4
    summary: "Data quality and anomaly detection"
    why: >
      dbt tests catch assertion failures, not a connector quietly returning
      40 percent fewer rows. Silent connector breakage is the number one
      failure mode of this class of pipeline and nothing currently detects
      it. Volume, null rate and distribution drift via Elementary or
      dbt-expectations.
    trigger: "Once 4+ sources are live"
    labels: [dbt, infra]
    points: 3

  - priority: 5
    summary: "Job spec snapshot at apply time"
    why: >
      Postings vanish. You need the exact text you applied against when
      prepping four weeks later. Cheap now, impossible to recover later.
    trigger: "Before the first real application"
    labels: [artefacts]
    points: 2

  - priority: 6
    summary: "CI pipeline"
    why: >
      Absent from the plan entirely. GitHub Actions running ruff, mypy,
      pytest and dbt build against a throwaway Postgres service container —
      what stops a refactor silently breaking the Step 6 normalisers.
    trigger: "As soon as the Step 6 test suite exists"
    labels: [infra]
    points: 3

  - priority: 7
    summary: "Double-submission guard"
    why: >
      Two agencies submitting you to the same client can get you excluded
      from the role outright. A real career risk specific to UK contracting.
      Track company x role x agency x date and warn before authorising.
    trigger: "Once applying through agencies"
    labels: [uk-contracting, ui]
    points: 2

  - priority: 8
    summary: "Structured output enforcement on all LLM calls"
    why: "Tool-use / JSON schema rather than parsing free text with a regex fallback."
    trigger: "Alongside the first eval regression caused by malformed output"
    labels: [llm]
    points: 2

  - priority: 9
    summary: "Embedding cache keyed on content hash"
    why: >
      Never re-embed unchanged text. Otherwise every full refresh re-embeds
      the same tens of thousands of stable job descriptions.
    trigger: "Once bronze exceeds ~10k postings"
    labels: [infra]
    points: 2

  - priority: 10
    summary: "LLM cost accounting and hard budget caps"
    why: "Token spend per feature per run in a table you can chart, plus a cap that
      fails the run rather than surprising you."
    trigger: "Before the first unattended scheduled generation run"
    labels: [llm, infra]
    points: 2

  - priority: 11
    summary: "pgvector index strategy (HNSW vs IVFFlat)"
    why: >
      pgvector degrades badly without an index past a few tens of thousands
      of rows. Also pick the embedding dimension deliberately — it drives
      storage and query cost more than expected.
    trigger: "Once vector search latency is noticeable"
    labels: [infra]
    points: 2

  - priority: 12
    summary: "Schema migrations for non-dbt tables"
    why: "Alembic or sqitch for bronze DDL, job_identity_map and artefact tables.
      Currently implicit — 'whatever I ran by hand last time'."
    trigger: "At the second manual DDL change"
    labels: [infra]
    points: 2

  - priority: 13
    summary: "Per-source circuit breaker"
    why: "Auto-disable and alert when a source starts returning garbage or 403s, rather
      than poisoning bronze with junk you then have to identify and purge."
    trigger: "At the first source outage"
    labels: [ingestion]
    points: 2

  - priority: 14
    summary: "Recorded API fixtures (VCR / pytest-recording)"
    why: "Connector tests that do not hit live APIs, and a free schema-drift signal
      when a recording stops matching reality."
    trigger: "Once connector count exceeds 5"
    labels: [ingestion, infra]
    points: 3

  - priority: 15
    summary: "Backup and restore, tested"
    why: "Neon free tier has no recovery story you have verified. Nightly pg_dump
      to GCS, and actually test the restore once."
    trigger: "Before the truth base and application history become irreplaceable"
    labels: [infra]
    points: 2

  - priority: 16
    summary: "Dead-letter table for failed records"
    why: "Failed records land somewhere inspectable rather than vanishing into a log
      line."
    trigger: "At the first silent parse failure"
    labels: [ingestion]
    points: 1

  - priority: 17
    summary: "Advisory locks on the dedup step"
    why: "Two overlapping runs clustering simultaneously would corrupt the identity
      map — the one table with a never-changes guarantee."
    trigger: "Before any concurrent scheduling of the pipeline"
    labels: [dedup, infra]
    points: 1

  - priority: 18
    summary: "PII posture and retention policy"
    why: >
      Your CV is your own PII; recruiter names and contacts in notes are
      other people's, which brings real GDPR obligations. Document retention,
      encrypt at rest. Also a credible thing to speak to in an interview
      about this project.
    trigger: "Before storing any third-party contact details"
    labels: [security]
    points: 2

  - priority: 19
    summary: "Least-privilege database roles"
    why: "Streamlit gets read-only plus writes to fct_application. Nothing else."
    trigger: "At the first internet-exposed deployment"
    labels: [security]
    points: 1

  - priority: 20
    summary: "CV personas — multiple positioning variants"
    why: >
      One truth base, several positionings (data engineering, AI
      engineering, consultancy) with different headline, emphasis order and
      skill ordering. The plan currently assumes a single canonical
      presentation.
    trigger: "Once applying across more than one category in earnest"
    labels: [cv, artefacts]
    points: 3

  - priority: 21
    summary: "Referral path detection"
    why: >
      A manual network table matched against dim_company. A referral shifts
      the outcome distribution more than any CV tailoring does, and the
      system currently has no concept of it.
    trigger: "Anytime — value is immediate but effort is manual"
    labels: [ui]
    points: 2

  - priority: 22
    summary: "Incremental dbt models on the marts"
    why: "Full refresh on fct_skill_demand across category x region x month x skill
      will get slow."
    trigger: "Once mart build time exceeds a few minutes"
    labels: [dbt]
    points: 2

  - priority: 23
    summary: "Reverse search — skill-anchored discovery"
    why: >
      Everything is job-anchored ('how do I match this?'). The inverse —
      'which employers are hiring for my exact signature' — falls out of the
      same embeddings and surfaces roles whose titles you would never have
      searched.
    trigger: "Once the truth base embeddings exist"
    labels: [ui, cv]
    points: 3

  - priority: 24
    summary: "Bronze partitioning and cold storage"
    why: "Partition raw_jobs by fetched_at month, move cold partitions to Parquet
      on GCS. Append-only with version rows grows faster than expected."
    trigger: "Once bronze exceeds a few GB"
    labels: [dbt, infra]
    points: 3

  - priority: 25
    summary: "LLM response caching"
    why: "Regenerating the same artefact for the same job should be free."
    trigger: "Once regeneration becomes a habit"
    labels: [llm]
    points: 1

  - priority: 26
    summary: "French-market support"
    why: >
      ESCO is multilingual and you work in both languages, but French CV
      conventions differ materially. Currently ambiguous — either scope it
      in deliberately or scope it out.
    trigger: "If targeting French-market roles"
    labels: [cv, artefacts]
    points: 5
