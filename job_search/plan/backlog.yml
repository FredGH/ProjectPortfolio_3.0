# =============================================================================
# Job Search Platform — canonical delivery backlog
# =============================================================================
# This file is the source of truth for the project plan.
# `python -m jira_sync_kit sync` (see the jira_sync_kit package) reads it
# and creates/updates Jira issues one-way.
#
# CONTRACT WITH JIRA
#   The sync script WRITES : summary, description, acceptance criteria,
#                            labels, story points, issue links, subtasks
#   The sync script NEVER  : status, assignee, comments, worklog, sprint
#
#   Those fields are owned by Jira alone. This disjoint ownership is what
#   makes the integration safe to re-run and removes any need for two-way
#   sync or conflict resolution.
#
# IDEMPOTENCY
#   On first creation the script writes the returned key back into this file
#   as `jira_key:`. On subsequent runs, a story with a `jira_key` is updated
#   in place, never recreated. Do not edit `jira_key` by hand.
#
# BUGS
#   Bugs are raised directly in Jira, never generated from this file.
#   Use labels below so bugs sort alongside the story they came from.
# =============================================================================

meta:
  project_key: JOB
  project_name: Job Search Platform
  issue_types:
    epic: Epic
    story: Story
    subtask: Sub-task
    bug: Bug
  default_labels: [jobsearch]
  # Labels used across the backlog — keep this list authoritative so the
  # sync script can validate rather than silently create typo labels.
  label_vocabulary:
  - infra
  - docker
  - gcp
  - ingestion
  - connector
  - dbt
  - dedup
  - calibration
  - llm
  - cv
  - artefacts
  - qa-bank
  - ui
  - orchestration
  - security
  - emergent
  - evals
  - uk-contracting
  - outcomes
  - llm-gateway
  - retrieval
  - extraction
  - tenancy
  - gdpr
  point_scale: [1, 2, 3, 5, 8]

# =============================================================================

epics:

  # ---------------------------------------------------------------------------
- key: PHASE0
  summary: "Phase 0 — Skeleton and vertical slice"
  description: >
    Establish the containerised skeleton and prove one job flows end to end
    from manual paste through to the bronze layer. Breadth of sources is
    explicitly out of scope here; the goal is a working spine.
  labels: [infra, ingestion]

  stories:

  - id: STEP-00
    summary: "Step 0 — Backlog and Jira sync"
    description: >
      Create the canonical plan file and the one-way Jira sync script so
      the backlog is version-controlled alongside the code it describes.
    acceptance: >
      Running `python plan/sync_jira.py` twice creates the full backlog on
      the first run and produces zero duplicates on the second.
    labels: [infra]
    points: 3
    blocks: [STEP-01]
    subtasks:
    - "Create Jira Free site and JOB project (Scrum template)"
    - "Generate API token, store in .env, add to .gitignore"
    - "Write plan/backlog.yml"
    - "Write plan/sync_jira.py using the python-jira client"
    - "Implement idempotency: write jira_key back into the YAML"
    - "Implement dependency links from the `blocks` field"
    - "Verify a second run updates rather than duplicates"

    jira_key: JOB-8
  - id: STEP-01
    summary: "Step 1 — Repository and container scaffold"
    description: >
      Monorepo layout and three Dockerfiles written BEFORE any application
      code, so the GCP path is never a retrofit.
    acceptance: >
      `docker compose up` yields a hello-world FastAPI on :8000, a
      Streamlit page on :8501, and a psql-reachable Postgres with the
      pgvector extension available.
    labels: [infra, docker]
    points: 5
    blocks: [STEP-01A]
    subtasks:
    - "Create monorepo layout: apps/{api,ui,pipeline}, dbt/, infra/, plan/, data/landing"
    - "Write apps/api/Dockerfile (FastAPI, uvicorn)"
    - "Write apps/ui/Dockerfile (Streamlit)"
    - "Write apps/pipeline/Dockerfile (dlt + dbt + dedup, batch entrypoint)"
    - "Write docker-compose.yml: postgres (pgvector/pgvector:pg16), api, ui, ollama"
    - "Add pipeline service under profiles: [cli] so it does not auto-start"
    - "Add n8n service under profiles: [orchestration]"
    - "Write config module using pydantic-settings, all values from env"
    - "Create .env.example with every variable, commit it; .env stays ignored"
    - "Set up pre-commit: ruff, ruff-format, mypy"
    - "Bind-mount ./data/landing into api and pipeline containers"
    - "LLM gateway module: llm.complete(task=..., ...) resolving model PER TASK from
      config"
    - "Never a single global LLM_PROVIDER switch — per-task routing is what avoids
      an all-or-nothing migration"
    - "Provider adapters: ollama and anthropic, identical call signature and response
      shape"
    - "Config table mapping task -> (provider, model, prompt_family) with local defaults"
    - "Log provider, model, prompt_version, token counts and cost on every call from
      day one"


    jira_key: JOB-16
  - id: STEP-01A
    summary: "Step 1a — Tenancy model and row-level isolation"
    description: >
      Multi-user is not a feature you add later — it is a property of every
      table you create. Retrofitting tenancy across 30+ tables is a rewrite,
      so the scoping convention and RLS go in before the first table exists.
      The core design is a two-zone split: job data is SHARED (collected
      once, identical for everyone), everything derived from a person is
      PER-USER.
    acceptance: >
      A query run as user A cannot return user B's truth base, scores,
      artefacts or applications even when the WHERE clause is omitted, and
      a test proves it.
    labels: [tenancy, infra, security]
    points: 8
    blocks: [STEP-02, STEP-03]
    subtasks:
    - "Define the two-zone rule and document it: SHARED = job postings, dedup, company
      intel, market marts, taxonomy, question text. PER-USER = truth base, scores,
      artefacts, applications, review progress, preferences"
    - "app_user table: id, email, display_name, created_at, status, locale"
    - "Every per-user table carries user_id NOT NULL with an FK and an index leading
      on user_id"
    - "Enable Postgres row-level security on every per-user table — primarily a CORRECTNESS
      guard: it catches the query that forgets WHERE user_id and would otherwise blend
      two users' scores"
    - "Set the session user context per request in FastAPI; never trust a client-supplied
      user_id"
    - "Separate DB roles: app role (RLS enforced) vs migration role (RLS bypass).
      The app never runs as owner"
    - "Write a negative test per per-user table: query without a WHERE clause as user
      A, assert zero rows of user B"
    - "Shared tables explicitly marked as such in the model layer so no one adds user_id
      by reflex"
    - "dbt: shared marts build once; per-user models take user_id as a grain, never
      a var"
    - "Per-user resource quotas table: monthly LLM spend cap, artefact generation
      cap, alert cap"
    - "Fair-use guard on shared API quotas so one user cannot exhaust the Adzuna allowance
      for everyone"

    jira_key: JOB-33
  - id: STEP-02
    summary: "Step 2 — Manual job entry, end to end"
    description: >
      Build the paste form first. It has no API keys, no rate limits and no
      external dependency, so it isolates pipeline mechanics from network
      flakiness. This is the vertical slice.
    acceptance: >
      Pasting a real LinkedIn posting produces a row in bronze.raw_jobs with
      correct source_name, job_url_canonical, payload.raw_text and
      payload_sha256.
    labels: [ingestion, ui]
    points: 8
    blocks: [STEP-03]
    subtasks:
    - "Streamlit form: source name (autocomplete + free text), job URL, job spec textarea"
    - "Streamlit form: optional posted date, company, title, location, notes"
    - "Implement canonicalise_url: lowercase host, strip utm_*/ref/src/trk/aff, trailing
      slash, one redirect hop"
    - "Extract source_job_id from known URL patterns (LinkedIn /jobs/view/{id}); fallback
      sha256(canonical_url)"
    - "FastAPI POST /ingest/manual accepting the payload"
    - "Write JSONL to landing/source=manual/dt=.../run_id=... via fsspec"
    - "Store raw pasted text verbatim in payload.raw_text — never overwritten"
    - "LLM structured extraction to the shared field contract (title, company, location,
      contract, salary, seniority, body)"
    - "Mark user-supplied overrides with field_source='user' so they win over the
      parser"
    - "Create bronze.raw_jobs DDL with unique (source_name, source_job_id, payload_sha256)"
    - "dlt pipeline loading landing JSONL into bronze.raw_jobs"
    - "Add entry_method column (api | manual | scraped) to bronze"

    jira_key: JOB-45
  - id: STEP-03
    summary: "Step 3 — Connector contract and shared runner"
    description: >
      Define the RawJob envelope and fetch() protocol, plus the shared
      runner that owns rate limiting, retries, run_id and landing writes.
      Retrofit the manual entry as a connector.
    acceptance: >
      Adding a new connector requires exactly one new file plus one block
      in sources.yml — no changes to the runner.
    labels: [ingestion, connector]
    points: 5
    blocks: [STEP-04]
    subtasks:
    - "Define RawJob envelope: source_name, source_job_id, job_url, job_url_canonical,
      payload, fetched_at, run_id, request_params, payload_sha256"
    - "Define connector protocol: fetch(query, since) -> Iterator[RawJob]"
    - "Write sources.yml schema: enabled, auth, calls_per_hour, concurrency, backoff,
      regions"
    - "Implement central token-bucket rate limiter driven by sources.yml"
    - "Implement retry with exponential backoff and jitter"
    - "Implement landing writer via fsspec (file:// and gs:// identical)"
    - "Emit run metadata: run_id, source, query, records, started_at, finished_at,
      status"
    - "Refactor manual entry to implement the connector protocol"
    - "CLI entrypoint: ingest --source X --query Y --region Z"

    jira_key: JOB-58
  - id: STEP-04
    summary: "Step 4 — First three API connectors"
    description: >
      Adzuna, Reed and Greenhouse — three deliberately different shapes:
      keyed REST with pagination, keyed REST with different pagination, and
      keyless per-company JSON.
    acceptance: >
      `docker compose run --rm pipeline ingest --source adzuna --query "data engineer"
      --region gb`
      lands files and loads bronze for all three sources.
    labels: [ingestion, connector]
    points: 8
    blocks: [STEP-04A]
    subtasks:
    - "Register for Adzuna app_id/app_key; implement connector with pagination"
    - "Register for Reed API key; implement connector"
    - "Implement Greenhouse connector against per-company board endpoints"
    - "Create target_company registry table (name, ats_provider, board_slug, active)"
    - "Seed registry with 20 companies by hand"
    - "Add all three to sources.yml with conservative rate limits"
    - "Verify every landed record carries source_name and job_url"

    jira_key: JOB-68
  - id: STEP-04A
    summary: "Step 4a — Discovery corpus (unbounded collection channel)"
    description: >
      A second collection channel that is NOT bound by the frozen keyword
      matrix. The targeted channel can only ever return roles you already
      thought to search for, which makes emergent-role detection
      structurally impossible against it. The discovery channel sweeps
      wide and shallow so unknown titles can surface at all.
    acceptance: >
      Discovery runs return titles that appear nowhere in the targeted
      keyword matrix, and every record carries collection_channel so the
      two corpora never contaminate each other's metrics.
    labels: [ingestion, connector, emergent]
    points: 5
    blocks: [STEP-05]
    subtasks:
    - "Add collection_channel column (targeted | discovery) to the RawJob envelope
      and bronze"
    - "Full ATS board dumps: pull EVERY role from target-company Greenhouse/Lever/Ashby
      boards, not just keyword matches"
    - "Adzuna category-level sweeps (IT jobs, engineering) rather than keyword sweeps"
    - "Broad seniority-agnostic queries across the target regions"
    - "Lower frequency than targeted collection (weekly, not daily) to stay inside
      free tiers"
    - "Cap discovery volume per run; log the title-diversity yield per run"
    - "Exclude discovery records from all targeted-channel trend metrics by default"
    - "Grow the target-company registry aggressively — board dumps are the richest
      emergent-title source"

    jira_key: JOB-76
  - id: STEP-04B
    summary: "Step 4b — Jooble connector"
    description: >
      A fourth connector, added after Step 4 shipped once a Jooble API key
      became available: keyed POST JSON, EU breadth (60+ countries).
      Follows the exact Connector protocol + CLI registry pattern Step 4
      established — one new file, one _CONNECTOR_BUILDERS/_QUERY_BUILDERS
      entry, one config/sources.yml block, no changes to the shared runner.
    acceptance: >
      `docker compose run --rm pipeline ingest --source jooble --query "data engineer"
      --region gb`
      lands files and loads bronze.
    labels: [ingestion, connector]
    points: 2
    subtasks:
    - "Implement JoobleConnector: POST https://jooble.org/api/{key} with JSON body
      {keywords, location, page}, page-number pagination"
    - "Wire into cli.py's _CONNECTOR_BUILDERS/_QUERY_BUILDERS registries and config/sources.yml"
    - "Verify every landed record carries source_name and job_url"

  # ---------------------------------------------------------------------------
    jira_key: JOB-440
  jira_key: JOB-1
- key: PHASE1
  summary: "Phase 1 — Silver layer"
  description: >
    Conform every source into a single column contract, and build the
    normalisation functions that dedup depends on.
  labels: [dbt]

  stories:

  - id: STEP-05
    summary: "Step 5 — dbt project and staging models"
    description: >
      One staging model per connector, each producing an identical column
      contract. All source quirks are isolated here and nowhere else.
    acceptance: >
      int_jobs__unioned returns rows from all four sources with no nulls in
      any required column, and `dbt test` passes.
    labels: [dbt]
    points: 5
    blocks: [STEP-05A]
    subtasks:
    - "Initialise dbt project with local and gcp targets in profiles.yml"
    - "Write stg_adzuna__jobs"
    - "Write stg_reed__jobs"
    - "Write stg_greenhouse__jobs"
    - "Write stg_manual__jobs"
    - "Define the shared column contract in schema.yml with model contracts enforced"
    - "Write int_jobs__unioned taking latest version per (source_name, source_job_id)"
    - "Add not_null / accepted_values tests on required columns"
    - "Add a source freshness check on bronze.raw_jobs"

    jira_key: JOB-85
  - id: STEP-05A
    summary: "Step 5a — IR35, contract terms and day-rate modelling"
    description: >
      UK contract engagement terms are the single most decisive filter for
      this market and they are NOT retrofittable: the fields must be in
      the staging contract from the start or months of collected data lack
      them. Also fixes the salary comparability problem — comparing a day
      rate against an annual figure as if they were the same number wrecks
      every salary mart downstream.
    acceptance: >
      Every silver__job_posting row carries engagement_type, ir35_status
      and a rate normalised to a comparable basis, with an explicit
      'unknown' rather than a null-as-guess.
    labels: [dbt, uk-contracting]
    points: 5
    blocks: [STEP-06]
    subtasks:
    - "Add engagement_type to the staging contract: permanent | contract | ftc | interim
      | unknown"
    - "Add ir35_status: inside | outside | not_applicable | undetermined | unknown"
    - "Add engagement_vehicle: umbrella | limited | paye | agency_paye | unknown"
    - "Extract IR35 and vehicle signals from job spec text (phrase rules first, LLM
      for the residual)"
    - "Add rate_basis: annual | daily | hourly, and rate_currency"
    - "Normalise to BOTH annualised and day-rate-equivalent, with a documented assumed
      working-days constant"
    - "Never coerce unknown to a default — 'unknown' is a value, not a null"
    - "Add contract_length_months and extension_likelihood signals where stated"
    - "Add ir35 and engagement filters to the hard-filter stage spec for Step 15"
    - "dbt tests: rate_basis always populated; annualised and daily figures never
      both null when a rate is stated"

    jira_key: JOB-95
  - id: STEP-06
    summary: "Step 6 — Normalisation functions"
    description: >
      Unglamorous and decisive. These pure functions determine whether the
      dedup engine works. Test them against real rows from your own bronze
      data, never invented examples.
    acceptance: >
      Pytest suite covers ~40 real examples pulled from bronze and passes.
    labels: [dbt, dedup]
    points: 5
    blocks: [STEP-07]
    subtasks:
    - "normalise_company: strip Ltd/Inc/GmbH/PLC/SA, punctuation, casing"
    - "Build company alias table (Meta/Facebook, Google/Alphabet, etc.)"
    - "strip_title: remove seniority prefixes, (m/f/d), req IDs, '- Remote', location
      suffixes — FOR MATCHING ONLY, never for display"
    - "title_raw: preserve the source title verbatim, always"
    - "title_for_display: strip only decoration (req IDs, (m/f/d), | Company, - Remote,
      location suffixes) and KEEP seniority and qualifiers"
    - "Three title fields, three purposes — never reuse the matching title in a generated
      document"
    - "normalise_location: to ISO country + NUTS region"
    - "parse_salary: to annualised GBP band with currency conversion"
    - "Extract 40 real examples from bronze into a fixtures file"
    - "Write the pytest suite against those fixtures"

  # ---------------------------------------------------------------------------
    jira_key: JOB-106
  jira_key: JOB-2
- key: PHASE2
  summary: "Phase 2 — Deduplication engine"
  description: >
    The phase that determines whether every downstream count is correct.
    Do not defer it. Includes the first GCP deploy to prove the path early.
  labels: [dedup]

  stories:

  - id: STEP-07
    summary: "Step 7 — Exact match and blocking"
    description: >
      Cheap matches first, then blocking to keep pairwise comparison out of
      O(n squared).
    acceptance: >
      Candidate pair generation across the full bronze table completes in
      seconds, and no block exceeds a few hundred records.
    labels: [dedup]
    points: 5
    blocks: [STEP-08]
    subtasks:
    - "Exact match on job_url_canonical"
    - "Compute content_sha256 over normalise(company||title||location||left(description,1000))"
    - "Define block key: normalise_company || left(strip_title,12) || country"
    - "Add soft block on company alone for divergent titles"
    - "Create Postgres index on the block key"
    - "Measure and log block size distribution"

    jira_key: JOB-117
  - id: STEP-08
    summary: "Step 8 — Similarity scoring"
    description: >
      Weighted multi-signal score across every candidate pair within a
      block.
    acceptance: >
      Scores computed and persisted for all candidate pairs, with each
      component signal stored separately for later tuning.
    labels: [dedup]
    points: 8
    blocks: [STEP-09]
    subtasks:
    - "Enable pg_trgm and pgvector extensions"
    - "Company similarity: trigram + alias table lookup"
    - "Title similarity: token-set ratio"
    - "Description SimHash 64-bit with Hamming distance"
    - "Description embedding cosine via pgvector"
    - "Location match after geo-normalisation"
    - "Posted date proximity, with hard veto beyond +/- 45 days"
    - "Salary band overlap signal"
    - "Persist all component scores alongside the blend, not just the blend"

    jira_key: JOB-124
  - id: STEP-09
    summary: "Step 9 — Calibration and review queue"
    description: >
      Pick thresholds from a precision-recall curve, not from intuition.
      A false merge silently loses a job, so precision matters more than
      recall here.
    acceptance: >
      Measured precision at the chosen auto-match threshold exceeds 0.95,
      and the review queue is usable in Streamlit.
    labels: [dedup, calibration]
    points: 5
    blocks: [STEP-10]
    subtasks:
    - "Hand-label 50 candidate pairs as match / not-match"
    - "Plot precision-recall across the threshold range"
    - "Set auto-match and auto-reject cutoffs in config"
    - "Build the Streamlit review queue for the middle band"
    - "Record manual decisions with is_manual_override flag"
    - "Document the measured precision figure in the repo"

    jira_key: JOB-134
  - id: STEP-10
    summary: "Step 10 — Clustering, identity map and survivorship"
    description: >
      Union-find over matched pairs, stable job_group_id assignment, and
      field-level survivorship rules.
    acceptance: >
      Running the full pipeline twice produces byte-identical job_group_id
      assignments.
    labels: [dedup]
    points: 8
    blocks: [STEP-11]
    subtasks:
    - "Union-find clustering over matched pairs (transitive groups)"
    - "Create silver.job_identity_map DDL"
    - "Incremental matching: new postings matched against cluster representatives,
      never full re-cluster"
    - "Guarantee job_group_id never changes once assigned"
    - "Make manual overrides sticky across runs"
    - "Survivorship: source rank ATS > Reed/Adzuna > aggregator > scraped"
    - "Resolve description and apply_url by SEPARATE field-level rules"
    - "title_for_display survives from the SAME source as apply_url — you must mirror
      the posting you actually apply to"
    - "Preserve every source URL in a sources[] array"
    - "Regression test: run pipeline twice, assert identical group IDs"

    jira_key: JOB-141
  - id: STEP-11
    summary: "Step 11 — Gold layer"
    description: >
      One row per real job, plus the market demand fact table with the
      selection-bias filter applied.
    acceptance: >
      dim_job has a unique job_group_id, and fct_market_demand excludes
      manual entries.
    labels: [dbt]
    points: 5
    blocks: [STEP-11A]
    subtasks:
    - "Build dim_job with job_group_id PK and sources[] array"
    - "Build dim_company"
    - "Build fct_market_demand (category x region x week) filtered to entry_method='api'"
    - "Document why manual entries are excluded from demand metrics"
    - "Add uniqueness and relationship tests across gold"

    jira_key: JOB-152
  - id: STEP-11A
    summary: "Step 11a — Job categorisation and seniority banding"
    description: >
      Classify every dim_job into a category and seniority band. Categories
      are the grain of every downstream chart, the skill gap analysis and
      the Q&A bank, so they are currently assumed everywhere and specified
      nowhere. Hybrid classifier: rules on normalised title first, then
      embedding nearest-centroid, LLM only for the residual.
    acceptance: >
      Hand-checking 100 classifications yields agreement above 90 percent,
      and every dim_job row has category, category_confidence and
      category_method populated.
    labels: [dbt, llm]
    points: 3
    blocks: [STEP-12]
    subtasks:
    - "Define the CLASSIFICATION taxonomy (7): software engineer, data engineer, data
      scientist, AI/ML engineer, analytics engineer, platform/DevOps, other"
    - "Define a separate QA_CATEGORY mapping (4 active): software engineer, data engineer,
      data scientist, AI engineer"
    - "Map analytics engineer -> data engineer; platform/DevOps -> software engineer;
      AI/ML engineer -> AI engineer"
    - "Store the mapping in config (category_map.yml), NOT hardcoded — it must be
      extendable without a code change"
    - "Persist qa_category on dim_job alongside category so the question bank lookup
      is a join, not a lookup table in code"
    - "Two taxonomies, two purposes: classification is analytical grain, qa_category
      is question-bank grain"
    - "Rules-based classifier on normalised title (target ~70% coverage, deterministic)"
    - "Build category centroids from labelled examples; embedding nearest-centroid
      for the remainder"
    - "LLM classification for the residual only, with confidence returned"
    - "Derive seniority_band: junior / mid / senior / lead / principal"
    - "Persist category, category_confidence, category_method, seniority_band on dim_job"
    - "Hand-check 100 classifications and record the agreement figure"
    - "Route low-confidence classifications to a review list rather than guessing"

    jira_key: JOB-158
  - id: STEP-12
    summary: "Step 12 — First GCP deployment"
    description: >
      Prove the cloud path now, while there is little to break. Deploy
      once, confirm, then return to local development.
    acceptance: >
      The same git commit runs locally and in GCP with only environment
      variables differing, and an ingestion run in GCP lands rows in the
      managed database.
    labels: [gcp, infra]
    points: 8
    blocks: [STEP-12A]
    subtasks:
    - "Terraform: Artifact Registry in europe-west2"
    - "Terraform: GCS landing bucket with the same path convention as local"
    - "Provision Neon Postgres, enable pgvector, store DSN in Secret Manager"
    - "Terraform: Cloud Run service for the API"
    - "Terraform: Cloud Run Job for the pipeline"
    - "Terraform: one least-privilege service account per workload"
    - "Cloud Build trigger from GitHub"
    - "Run the ingestion job in GCP and verify rows land"
    - "Document the local vs gcp env var matrix in README"

  # ---------------------------------------------------------------------------
    jira_key: JOB-172
  jira_key: JOB-3
- key: PHASE3
  summary: "Phase 3 — CV truth base and relevance scoring"
  description: >
    Decompose the CV into a constrained truth base, then build and calibrate
    the four-stage ranking funnel.
  labels: [cv, llm]

  stories:

  - id: STEP-12A
    summary: "Step 12a — LLM eval harness and prompt versioning"
    description: >
      The largest robustness gap in the plan. Every dbt model has tests;
      every LLM component currently has none, which means each prompt edit
      is an unverifiable change to a system you cannot regression-test.
      Build this BEFORE the first real LLM feature (Step 13), not after,
      so every subsequent LLM step ships with evals from day one.
    acceptance: >
      Changing any prompt runs the golden set and reports pass/fail per
      case, and every generated artefact in the database carries the
      prompt_version that produced it.
    labels: [llm, evals, llm-gateway]
    points: 8
    blocks: [STEP-13]
    subtasks:
    - "Create a golden set: hand-curated (input, expected output) cases per LLM component"
    - "Cover CV extraction, JD skill extraction, categorisation, scoring rationale,
      tailoring, letter, Q&A"
    - "Define per-component metrics: exact match, field-level F1, LLM-as-judge with
      a rubric where exact match is wrong"
    - "Use RAGAS faithfulness for the tailoring evals: decompose output into atomic
      claims, verify each against the truth base"
    - "Faithfulness is a more principled form of the evidence_ref check — use the
      library, do not reinvent it"
