name: cortex_signal_to_action
version: '1.0.0'
config-version: 2

profile: cortex_signal_to_action

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "tests/generic"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Phase 8 — Observability hooks.
# log_test_results() merges the pipeline run summary into PIPELINE_RUN_LOG,
# calls UPLOAD_DBT_ARTIFACTS, and bulk-inserts all test results into DATA_QUALITY_LOG.
# Both are no-ops when observability_enabled = false (default for local dev).
on-run-end:
  - "{{ log_test_results() }}"

vars:
  observability_enabled: false
  drift_baseline_run_id: null

models:
  cortex_signal_to_action:
    +post-hook: "{{ log_model_health() }}"
    bronze:
      +materialized: table
      +schema: bronze
      +tags: ['bronze']
    silver:
      +materialized: table
      +schema: silver
      +tags: ['silver']
      slv_feedback_enriched:
        +post-hook:
          - "{{ log_model_health() }}"
          - "{{ log_cortex_usage() }}"
    gold:
      +materialized: table
      +schema: gold
      +tags: ['gold']

seeds:
  cortex_signal_to_action:
    +schema: bronze
    sample_feedback:
      +column_types:
        feedback_id: varchar(20)
        customer_id: varchar(36)
        product: varchar(100)
        review_text: varchar(500)
        review_date: date
        language: varchar(5)
        channel: varchar(20)
    olist_mmm_weekly_spend:
      +column_types:
        iso_week: varchar(10)
        week_start_date: date
        weekly_revenue: float
        tv_spend: float
        paid_search_spend: float
        social_spend: float
        email_spend: float
        display_spend: float
        holiday_flag: integer
        black_friday_flag: integer
        competitor_index: float
        avg_temperature: float

snapshots:
  cortex_signal_to_action:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: _updated_at
