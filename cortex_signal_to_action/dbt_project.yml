name: cortex_signal_to_action
version: '1.0.0'
config-version: 2

profile: cortex_signal_to_action

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Populated in Phase 8 — Observability.
# Final hooks: {{ log_test_results() }} + CALL UPLOAD_DBT_ARTIFACTS(...)
on-run-end: []

vars:
  observability_enabled: false
  drift_baseline_run_id: null

models:
  cortex_signal_to_action:
    bronze:
      +materialized: table
      +schema: bronze
      +tags: ['bronze']
    silver:
      +materialized: table
      +schema: silver
      +tags: ['silver']
    gold:
      +materialized: table
      +schema: gold
      +tags: ['gold']

seeds:
  cortex_signal_to_action:
    +schema: bronze
    sample_feedback:
      +column_types:
        feedback_id: varchar(20)
        customer_id: varchar(36)
        product: varchar(100)
        review_text: varchar(500)
        review_date: date
        language: varchar(5)
        channel: varchar(20)
    olist_mmm_weekly_spend:
      +column_types:
        iso_week: varchar(10)
        week_start_date: date
        weekly_revenue: float
        tv_spend: float
        paid_search_spend: float
        social_spend: float
        email_spend: float
        display_spend: float
        holiday_flag: integer
        black_friday_flag: integer
        competitor_index: float
        avg_temperature: float

snapshots:
  cortex_signal_to_action:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: _updated_at
