version: 2

models:
  - name: mrt_customer_segments
    description: >
      Customer segmentation using RFM-based NTILE(5) clustering with CORTEX.COMPLETE-generated
      segment labels and rule-based predicted LTV. One row per unique customer.
      Grain: customer_unique_id (unique).
    tests:
      - assert_row_count_in_range:
          min_rows: 50000
          max_rows: 200000
    columns:
      - name: customer_unique_id
        description: "Primary key. De-duplicated customer identifier from slv_customer_profile."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('slv_customer_profile')
              field: customer_unique_id
      - name: segment_id
        description: "Cluster assignment 1–5 from NTILE(5) on rfm_score; 1=lowest, 5=champions."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
      - name: segment_label
        description: "Human-readable segment name generated by CORTEX.COMPLETE (e.g. 'Champions')."
        tests:
          - not_null
      - name: rfm_score
        description: "Composite RFM score (mean of recency, frequency, monetary NTILE scores); range 1.0–5.0."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1.0
              max_value: 5.0
      - name: predicted_ltv
        description: "Estimated lifetime value in BRL: monetary_value × frequency × recency decay factor."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true
      - name: churn_risk_score
        description: "Rule-based churn risk score; 0.1 (low) to 1.0 (high)."
        tests:
          - not_null
      - name: _loaded_at
        description: "Pipeline ingestion timestamp (UTC)."
        tests:
          - not_null

  - name: mrt_sentiment_by_segment
    description: >
      Review sentiment and theme aggregated by customer segment, product category, and ISO review week.
      Grain: (segment_id, product_category, iso_week).
    tests:
      - assert_no_duplicate_pk:
          column_names: ['segment_id', 'product_category', 'iso_week']
      - assert_row_count_in_range:
          min_rows: 100
    columns:
      - name: segment_id
        description: "Customer segment (1–5). Foreign key to mrt_customer_segments."
        tests:
          - not_null
          - relationships:
              to: ref('mrt_customer_segments')
              field: segment_id
      - name: segment_label
        description: "Human-readable segment label from mrt_customer_segments."
        tests:
          - not_null
      - name: product_category
        description: "Product category name from brz_olist_products; 'unknown' when not resolved."
        tests:
          - not_null
      - name: iso_week
        description: "ISO 8601 review week (YYYY-WNN)."
        tests:
          - not_null
      - name: total_reviews
        description: "Count of reviews in this (segment, category, week) bucket."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
      - name: avg_sentiment_score
        description: "Mean sentiment score for the bucket; range -1.0 to 1.0."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -1.0
              max_value: 1.0
      - name: negative_review_pct
        description: "Proportion of NEGATIVE-labelled reviews; range 0.0 to 1.0."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.0
              max_value: 1.0
      - name: dominant_theme
        description: "Most frequent Cortex-extracted theme in the bucket."
        tests:
          - not_null
          - accepted_values:
              values:
                - product_quality
                - delivery
                - customer_service
                - price_value
                - packaging
                - other
      - name: _loaded_at
        description: "Pipeline ingestion timestamp (UTC)."
        tests:
          - not_null

  - name: mrt_mmm_attribution
    description: >
      Channel-level revenue attribution and ROI per ISO week. Spend-weighted proportional
      attribution with efficiency multipliers calibrated to the synthetic DGP.
      Grain: (iso_week, channel).
    tests:
      - assert_no_duplicate_pk:
          column_names: ['iso_week', 'channel']
      - assert_row_count_in_range:
          min_rows: 500
          max_rows: 800
    columns:
      - name: iso_week
        description: "ISO 8601 week (YYYY-WNN). Foreign key to slv_mmm_weekly."
        tests:
          - not_null
          - relationships:
              to: ref('slv_mmm_weekly')
              field: iso_week
      - name: channel
        description: "Marketing channel name."
        tests:
          - not_null
          - accepted_values:
              values: ['tv', 'paid_search', 'social', 'email', 'display']
      - name: spend
        description: "Raw channel spend in BRL for the week."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: attributed_revenue
        description: "Revenue attributed to this channel via weighted adstock share."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: roi
        description: "Return on investment: attributed_revenue / spend. 0.0 when spend = 0."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: marginal_roi
        description: "Incremental revenue per additional BRL spent (efficiency multiplier proxy)."
        tests:
          - not_null
      - name: _loaded_at
        description: "Pipeline ingestion timestamp (UTC)."
        tests:
          - not_null

  - name: mrt_funnel_conversion
    description: >
      MQL to delivered-order conversion rates by acquisition channel.
      Best-effort join via seller_id = mql_id UUID — low coverage without the closed_deals bridge.
      Grain: acquisition_channel (unique).
    tests:
      - assert_row_count_in_range:
          min_rows: 1
          max_rows: 30
    columns:
      - name: acquisition_channel
        description: "Primary key. MQL origin channel; 'unknown' when origin is NULL."
        tests:
          - unique
          - not_null
      - name: total_mqls
        description: "Total MQLs from this channel."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: converted_mqls
        description: "MQLs that led to at least one delivered order."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: mql_to_order_conversion_rate
        description: "converted_mqls / total_mqls; range 0.0–1.0."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.0
              max_value: 1.0
      - name: total_attributed_revenue
        description: "Sum of first-order revenue from converted MQLs in BRL."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: _loaded_at
        description: "Pipeline ingestion timestamp (UTC)."
        tests:
          - not_null

  - name: mrt_nba_actions
    description: >
      Next-best-action recommendations per customer segment, generated via CORTEX.COMPLETE.
      One row per segment with structured action, channel, and message draft.
      Grain: segment_id (unique).
    tests:
      - assert_row_count_in_range:
          min_rows: 5
          max_rows: 10
    columns:
      - name: segment_id
        description: "Primary key. Customer segment identifier (1–5)."
        tests:
          - unique
          - not_null
      - name: segment_label
        description: "Human-readable segment name from mrt_customer_segments."
        tests:
          - not_null
      - name: action
        description: "Recommended next-best action type generated by CORTEX.COMPLETE."
        tests:
          - not_null
          - accepted_values:
              values:
                - reactivation_campaign
                - loyalty_reward
                - upsell_offer
                - win_back_discount
                - retention_alert
                - cross_sell_recommendation
      - name: channel
        description: "Recommended delivery channel generated by CORTEX.COMPLETE."
        tests:
          - not_null
          - accepted_values:
              values: ['email', 'sms', 'push_notification', 'social_ads', 'direct_mail']
      - name: message_draft
        description: "50-80 word personalised message draft generated by CORTEX.COMPLETE."
        tests:
          - not_null
      - name: priority
        description: "Action priority level: high, medium, or low."
        tests:
          - not_null
          - accepted_values:
              values: ['high', 'medium', 'low']
      - name: expected_uplift_pct
        description: "Expected conversion uplift percentage (0–30) estimated by CORTEX.COMPLETE."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 30
      - name: _loaded_at
        description: "Pipeline ingestion timestamp (UTC)."
        tests:
          - not_null
