# Oracle Cloud Free Tier — ARM64 production overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs. base:
#   - platform: linux/arm64 on all services (Arm A1 cores)
#   - OLLAMA_NUM_PARALLEL=2 (4 cores → 2 inference threads; 2 cores each)
#   - No exposed ports — Cloudflare Tunnel handles all public ingress
#   - cloudflared service added for Tunnel connectivity
#   - restart: always for all long-running services
#   - POSTGRES_PASSWORD injected via Docker secret (file: ./secrets/postgres_password)
#     Create it once on the host:
#       mkdir -p /opt/complaint_analyser/secrets
#       printf '%s' 'your-strong-password' > /opt/complaint_analyser/secrets/postgres_password
#       chmod 600 /opt/complaint_analyser/secrets/postgres_password

secrets:
  postgres_password:
    file: ./secrets/postgres_password

services:

  qdrant:
    platform: linux/arm64
    ports: !reset []
    restart: always

  postgres:
    platform: linux/arm64
    ports: !reset []
    restart: always
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  redis:
    platform: linux/arm64
    ports: !reset []
    restart: always

  n8n:
    platform: linux/arm64
    ports: !reset []
    restart: always

  ollama:
    platform: linux/arm64
    ports: !reset []
    environment:
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_NUM_CTX: "2048"
    restart: always

  api:
    platform: linux/arm64
    ports: !reset []
    restart: always
    secrets:
      - postgres_password
    entrypoint: ["/app/scripts/entrypoint.sh"]

  worker-fast:
    platform: linux/arm64
    restart: always
    secrets:
      - postgres_password
    entrypoint: ["/app/scripts/entrypoint.sh"]

  worker-assess:
    platform: linux/arm64
    restart: always
    secrets:
      - postgres_password
    entrypoint: ["/app/scripts/entrypoint.sh"]

  spacy:
    platform: linux/arm64
    ports: !reset []
    restart: always

  bertopic:
    platform: linux/arm64
    secrets:
      - postgres_password
    entrypoint: ["/app/scripts/entrypoint.sh"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    platform: linux/arm64
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_healthy
