[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_triage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "spacy>=3.7",
    "gliner>=0.2",
    "symspellpy>=6.7",
    "flashtext>=2.7",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "langchain-text-splitters>=0.2",
    "httpx>=0.27",
    "langgraph>=0.2",
    "arq>=0.25",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["coverage", "ruff", "isort", "black"]
eval = ["ragas>=0.1", "datasets>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_triage*"]

[tool.ruff]
line-length = 88

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
