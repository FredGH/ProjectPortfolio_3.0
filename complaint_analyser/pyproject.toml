[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_triage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["coverage", "ruff", "isort", "black", "pyyaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_triage*"]

[tool.ruff]
line-length = 88

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
