# Cloudflare Tunnel configuration
#
# Prerequisites (run once on the Oracle VM):
#   cloudflared tunnel login
#   cloudflared tunnel create complaint-analyser
#   cloudflared tunnel route dns complaint-analyser api.yourdomain.com
#   cloudflared tunnel route dns complaint-analyser n8n.yourdomain.com
#
# Copy the generated credentials JSON to /etc/cloudflared/credentials.json
# on the host, or mount it into the cloudflared container.
#
# In production the tunnel is run via the CLOUDFLARE_TUNNEL_TOKEN env var
# (docker-compose.prod.yml) — this file is used for local cloudflared installs.

tunnel: <your-tunnel-id>
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # FastAPI triage service
  - hostname: api.yourdomain.com
    service: http://api:8000
    originRequest:
      connectTimeout: 10s
      noTLSVerify: false

  # n8n workflow editor
  - hostname: n8n.yourdomain.com
    service: http://n8n:5678
    originRequest:
      connectTimeout: 10s
      noTLSVerify: false

  # Catch-all — return 404 for any unmatched hostname
  - service: http_status:404
